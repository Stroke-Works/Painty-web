<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#c9b6f9">
    <meta name="description" content="Painty — A little space for creativity.">
    <title>Painty</title>

    <script>document.documentElement.classList.add("js");</script>
    <link rel="icon" href="assets/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/style.css">
    <script src="assets/script.js" defer></script>
</head>

<body>
    <header class="header">
        <button class="theme-toggle" id="theme-toggle" type="button"
            aria-label="Switch to dark mode" title="Switch theme">
            <svg class="sun-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5V5M12 19V21.5M4.93 4.93L6.56 6.56M17.44 17.44L19.07 19.07M2.5 12H5M19 12H21.5M4.93 19.07L6.56 17.44M17.44 6.56L19.07 4.93" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <svg class="moon-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19.2 14.8A7.7 7.7 0 0 1 9.2 4.8a7.7 7.7 0 1 0 10 10Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
    </header>

    <main>
        <section class="hero">
            <img class="hero-art reveal" src="assets/icon.png" alt="" aria-hidden="true">
            <span class="hero-eyebrow reveal" style="--delay: .1s">A little space for creativity</span>
            <h1 class="painty-title reveal" style="--delay: .2s">Painty<span>.</span></h1>

            <a id="download-button" class="download-button reveal" style="--delay: .3s"
                href="https://github.com/Stroke-Works/Painty/releases/latest"
                target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 3V15M7 10L12 15L17 10M5 19H19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Download</span>
                <img class="download-arrow theme-icon" src="assets/down_l.svg" data-theme-icon="ink" alt="" aria-hidden="true">
            </a>

            <p class="download-info reveal" style="--delay: .4s" id="download-info">Windows · Free</p>

            <p class="download-error" id="download-error" hidden>
                Could not find the installer.
                <a href="https://github.com/Stroke-Works/Painty/releases/latest">
                    Browse releases
                    <img class="theme-icon" src="assets/down_l.svg" data-theme-icon="bg" alt="" aria-hidden="true">
                </a>
            </p>
        </section>

        <section class="versions-section reveal" id="versions">
            <div class="versions-heading">
                <h2>Previous versions</h2>
                <span class="versions-label">Release archive</span>
            </div>

            <div class="versions-list" id="versions-list">
                <div class="loading-state">
                    <span class="loader"></span>
                    Loading releases...
                </div>
            </div>

            <a class="all-releases" href="https://github.com/Stroke-Works/Painty/releases"
                target="_blank" rel="noopener noreferrer">
                View all releases on GitHub <span>↗</span>
            </a>
        </section>
    </main>

    <footer class="footer reveal">
        <span class="copyright">© 2026 Gtisseran</span>

        <a class="github-link" href="https://github.com/Stroke-Works/Painty"
            target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.53v-2.05c-3.1.67-3.76-1.32-3.76-1.32-.5-1.29-1.23-1.63-1.23-1.63-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15.99 1.7 2.6 1.21 3.23.93.1-.72.39-1.21.71-1.49-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.21 1.15-2.99-.12-.28-.5-1.42.11-2.95 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.11-1.44 3.05-1.14 3.05-1.14.61 1.53.23 2.67.11 2.95.72.78 1.15 1.77 1.15 2.99 0 4.29-2.62 5.24-5.11 5.51.4.35.76 1.03.76 2.08V22c0 .29.2.63.77.52A11.1 11.1 0 0 0 12 .9Z"/>
            </svg>
            <span>Open source on GitHub</span>
            <span class="github-arrow">↗</span>
        </a>
    </footer>
</body>
</html>
